version: '3.9'

services:
  api:
    image: soat-billing-service-api
    build:
      context: .
      dockerfile: src/Api/Dockerfile

    ports:
      - "8082:8080"

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

    networks:
      - soat-billing-network

    restart: unless-stopped

  # Para testar a saga completa localmente, aponte RabbitMq__Host deste serviço e do
  # OS Service/Execução Service para o mesmo broker (rede Docker externa comum, ou um
  # RabbitMQ único rodando fora do compose de cada serviço) — ver
  # PLANO-FASE-4-MICROSSERVICOS.md.
  rabbitmq:
    image: rabbitmq:3-management-alpine

    ports:
      - "5673:5672"
      - "15673:15672"

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 5

    networks:
      - soat-billing-network

    restart: unless-stopped

  postgres:
    image: postgres:16-alpine

    env_file:
      - .env

    ports:
      - "5434:5432"

    volumes:
      - soat_billing_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

    networks:
      - soat-billing-network

    restart: unless-stopped

volumes:
  soat_billing_postgres_data:

networks:
  soat-billing-network:
