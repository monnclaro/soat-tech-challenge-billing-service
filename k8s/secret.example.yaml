# Template — NÃO aplicado diretamente. O CI/CD gera o Secret real em tempo de deploy
# a partir do SSM Parameter Store (RDS via infra-database, JWT/RabbitMQ via infra-k8s,
# Mercado Pago via GitHub Secrets do próprio repo). Para rodar localmente, use o
# docker compose (ver README) em vez de aplicar este arquivo.

apiVersion: v1
kind: Secret

metadata:
  name: soat-billing-api-secret
  namespace: soat-billing

type: Opaque

stringData:
  ConnectionStrings__Default: "Host=postgres-service;Port=5432;Database=soat_billing;Username=soat_billing_user;Password=postgres"
  JwtSettings__Secret: "SuaChaveSuperSecretaComMinimo32Caracteres"
  JwtSettings__ExpirationHours: "2"
  MercadoPago__AccessToken: "TEST-0000000000000000-000000-00000000000000000000000000000000-000000000"
  MercadoPago__WebhookSecret: "sua-webhook-secret-mercadopago"
  MercadoPago__NotificationUrl: "http://SEU_NODE_IP:30082/api/v1/webhooks/mercadopago"
  RabbitMq__Host: "rabbitmq.rabbitmq.svc.cluster.local"
  RabbitMq__VirtualHost: "/"
  RabbitMq__Username: "guest"
  RabbitMq__Password: "guest"
  NEW_RELIC_LICENSE_KEY: "sua-license-key-newrelic"
